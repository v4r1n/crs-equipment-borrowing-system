<style>
  :root {
    --crs-primary: #155e75;
    --crs-primary-dark: #0f4658;
    --crs-primary-soft: #e6f4f7;
    --crs-accent: #0f766e;
    --crs-ink: #172033;
    --crs-muted: #667085;
    --crs-border: #e4e9f0;
    --crs-surface: #ffffff;
    --crs-canvas: #f5f7fa;
    --crs-sidebar-width: 264px;
    --crs-topbar-height: 76px;
    --crs-mobile-nav-height: 76px;
    --crs-radius-sm: 0.625rem;
    --crs-radius: 0.875rem;
    --crs-radius-lg: 1.125rem;
    --crs-shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 4px rgba(16, 24, 40, 0.04);
    --crs-shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
    --crs-focus: 0 0 0 0.22rem rgba(21, 94, 117, 0.2);
    --bs-primary: var(--crs-primary);
    --bs-primary-rgb: 21, 94, 117;
    --bs-body-font-family: "Noto Sans Thai", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --bs-body-color: var(--crs-ink);
    --bs-body-bg: var(--crs-canvas);
    --bs-border-color: var(--crs-border);
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    min-width: 320px;
    background: var(--crs-canvas);
    scroll-behavior: smooth;
  }

  body {
    min-width: 320px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0;
    color: var(--crs-ink);
    background: var(--crs-canvas);
    font-family: var(--bs-body-font-family);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  [hidden] {
    display: none !important;
  }

  img,
  svg {
    max-width: 100%;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  a {
    color: var(--crs-primary);
  }

  :focus-visible {
    outline: 3px solid rgba(21, 94, 117, 0.32);
    outline-offset: 2px;
  }

  #scan-image-input:focus-visible + .scan-image-label {
    outline: 3px solid rgba(21, 94, 117, 0.32);
    outline-offset: 2px;
    box-shadow: var(--crs-focus);
  }

  .scan-image-label[aria-disabled="true"] {
    pointer-events: none;
    opacity: 0.65;
  }

  .skip-link {
    position: fixed;
    top: 0.75rem;
    left: 0.75rem;
    z-index: 1100;
    padding: 0.625rem 0.9rem;
    border-radius: var(--crs-radius-sm);
    color: #fff;
    background: var(--crs-primary-dark);
    font-weight: 600;
    text-decoration: none;
    transform: translateY(-160%);
    transition: transform 160ms ease;
  }

  .skip-link:focus {
    color: #fff;
    transform: translateY(0);
  }

  .noscript-message {
    position: fixed;
    inset: 0 0 auto;
    z-index: 1200;
    padding: 0.75rem 1rem;
    color: #7a2e0e;
    background: #fff2e8;
    border-bottom: 1px solid #fed7aa;
    text-align: center;
    font-weight: 600;
  }

  .btn {
    min-height: 42px;
    border-radius: 0.7rem;
    font-weight: 600;
  }

  .btn-sm {
    min-height: 36px;
  }

  .btn-primary {
    --bs-btn-bg: var(--crs-primary);
    --bs-btn-border-color: var(--crs-primary);
    --bs-btn-hover-bg: var(--crs-primary-dark);
    --bs-btn-hover-border-color: var(--crs-primary-dark);
    --bs-btn-active-bg: var(--crs-primary-dark);
    --bs-btn-active-border-color: var(--crs-primary-dark);
    --bs-btn-disabled-bg: #7da4b2;
    --bs-btn-disabled-border-color: #7da4b2;
    --bs-btn-focus-shadow-rgb: 21, 94, 117;
  }

  .btn-outline-primary {
    --bs-btn-color: var(--crs-primary);
    --bs-btn-border-color: #7da4b2;
    --bs-btn-hover-bg: var(--crs-primary);
    --bs-btn-hover-border-color: var(--crs-primary);
    --bs-btn-active-bg: var(--crs-primary-dark);
    --bs-btn-active-border-color: var(--crs-primary-dark);
    --bs-btn-focus-shadow-rgb: 21, 94, 117;
  }

  .btn-light {
    --bs-btn-bg: #fff;
    --bs-btn-border-color: var(--crs-border);
    --bs-btn-hover-bg: #f8fafc;
    --bs-btn-hover-border-color: #cfd7e3;
  }

  .form-control,
  .form-select,
  .input-group-text {
    min-height: 44px;
    border-color: #d7dee8;
    border-radius: 0.7rem;
  }

  .form-control:focus,
  .form-select:focus {
    border-color: #4f879a;
    box-shadow: var(--crs-focus);
  }

  .form-label,
  legend {
    color: #344054;
    font-weight: 600;
  }

  .form-text {
    color: var(--crs-muted);
  }

  .input-group > :not(:first-child) {
    border-top-left-radius: 0;
    border-bottom-left-radius: 0;
  }

  .input-group > :not(:last-child) {
    border-top-right-radius: 0;
    border-bottom-right-radius: 0;
  }

  .app-startup-state {
    position: fixed;
    inset: 0;
    z-index: 1080;
    display: grid;
    place-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 1.25rem;
    overflow: auto;
    background:
      radial-gradient(circle at 15% 15%, rgba(21, 94, 117, 0.1), transparent 32rem),
      radial-gradient(circle at 90% 88%, rgba(15, 118, 110, 0.08), transparent 28rem),
      var(--crs-canvas);
  }

  .startup-card {
    width: min(100%, 440px);
    padding: clamp(1.75rem, 6vw, 3rem);
    border: 1px solid rgba(228, 233, 240, 0.9);
    border-radius: var(--crs-radius-lg);
    background: rgba(255, 255, 255, 0.96);
    box-shadow: var(--crs-shadow);
  }

  .global-loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 1070;
    display: grid;
    place-items: center;
    padding: 1rem;
    background: rgba(245, 247, 250, 0.72);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
  }

  .global-loading-card {
    display: flex;
    align-items: center;
    max-width: min(100%, 360px);
    padding: 0.8rem 1rem;
    gap: 0.7rem;
    border: 1px solid var(--crs-border);
    border-radius: 999px;
    background: #fff;
    box-shadow: var(--crs-shadow);
    color: #344054;
    font-size: 0.86rem;
    font-weight: 600;
  }

  .access-card {
    width: min(100%, 520px);
  }

  .brand-mark {
    display: inline-grid;
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    place-items: center;
    border-radius: 0.8rem;
    color: #fff;
    background: linear-gradient(145deg, #1b718c, var(--crs-primary-dark));
    box-shadow: 0 8px 18px rgba(15, 70, 88, 0.2);
    font-size: 1.25rem;
  }

  .brand-mark-lg {
    width: 64px;
    height: 64px;
    border-radius: 1.1rem;
    font-size: 1.75rem;
  }

  .brand-mark-sm {
    width: 38px;
    height: 38px;
    border-radius: 0.7rem;
    font-size: 1.05rem;
  }

  .state-icon {
    display: grid;
    width: 68px;
    height: 68px;
    place-items: center;
    border-radius: 50%;
    font-size: 1.8rem;
  }

  .state-icon-warning {
    color: #9a4c13;
    background: #fff3df;
  }

  .state-icon-danger {
    color: #b42318;
    background: #feeceb;
  }

  .state-icon-success {
    color: #087a55;
    background: #e9f8f1;
  }

  .eyebrow {
    color: var(--crs-primary);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .request-id {
    color: var(--crs-muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.75rem;
    overflow-wrap: anywhere;
  }

  .request-id:empty {
    display: none;
  }

  .min-w-0 {
    min-width: 0;
  }

  .app-shell {
    min-height: 100vh;
    min-height: 100dvh;
  }

  .app-sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    z-index: 1025;
    flex-direction: column;
    width: var(--crs-sidebar-width);
    border-right: 1px solid var(--crs-border);
    background: #fff;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    min-height: var(--crs-topbar-height);
    padding: 0.9rem 1.1rem;
    border-bottom: 1px solid var(--crs-border);
  }

  .brand-link {
    display: flex;
    align-items: center;
    min-width: 0;
    gap: 0.75rem;
    color: var(--crs-ink);
    text-decoration: none;
  }

  .brand-link:hover {
    color: var(--crs-primary);
  }

  .brand-copy {
    display: flex;
    min-width: 0;
    flex-direction: column;
    line-height: 1.3;
  }

  .brand-copy strong {
    max-width: 170px;
    overflow: hidden;
    font-size: 0.94rem;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .brand-copy small {
    color: var(--crs-muted);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
  }

  .sidebar-nav {
    flex: 1 1 auto;
    padding: 1rem 0.8rem;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  .sidebar-section-label {
    margin: 0 0.7rem 0.35rem;
    color: #98a2b3;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .sidebar-link {
    position: relative;
    display: flex;
    align-items: center;
    min-height: 46px;
    margin-bottom: 0.2rem;
    padding: 0.65rem 0.75rem;
    gap: 0.75rem;
    border-radius: 0.7rem;
    color: #475467;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    transition: color 140ms ease, background-color 140ms ease, transform 140ms ease;
  }

  .sidebar-link i {
    width: 1.25rem;
    color: #667085;
    font-size: 1.08rem;
    text-align: center;
  }

  .sidebar-link:hover {
    color: var(--crs-primary-dark);
    background: #f2f7f8;
  }

  .sidebar-link.is-active,
  .sidebar-link[aria-current="page"] {
    color: var(--crs-primary-dark);
    background: var(--crs-primary-soft);
  }

  .sidebar-link.is-active i,
  .sidebar-link[aria-current="page"] i {
    color: var(--crs-primary);
  }

  .sidebar-link-indicator {
    width: 0.4rem;
    height: 0.4rem;
    margin-left: auto;
    border-radius: 50%;
    background: #17b26a;
  }

  .sidebar-footer {
    padding: 0.8rem;
    border-top: 1px solid var(--crs-border);
  }

  .account-summary {
    display: flex;
    align-items: center;
    min-width: 0;
    padding: 0.55rem;
    gap: 0.65rem;
    border-radius: 0.75rem;
    color: var(--crs-ink);
    text-decoration: none;
  }

  .account-summary:hover {
    color: var(--crs-primary-dark);
    background: #f5f8fa;
  }

  .account-summary-copy,
  .topbar-account-copy {
    min-width: 0;
    flex-direction: column;
    line-height: 1.3;
  }

  .account-summary-copy {
    display: flex;
  }

  .account-summary-copy strong,
  .topbar-account-copy strong {
    overflow: hidden;
    font-size: 0.82rem;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .account-summary-copy small,
  .topbar-account-copy small {
    color: var(--crs-muted);
    font-size: 0.7rem;
  }

  .user-avatar {
    display: inline-grid;
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    place-items: center;
    border-radius: 50%;
    color: var(--crs-primary-dark);
    background: var(--crs-primary-soft);
    font-size: 0.76rem;
    font-weight: 700;
  }

  .app-version {
    margin-top: 0.65rem;
    color: #98a2b3;
    font-size: 0.65rem;
    text-align: center;
  }

  .app-content-column {
    min-width: 0;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .app-topbar {
    position: sticky;
    top: 0;
    z-index: 1015;
    display: flex;
    align-items: center;
    min-height: var(--crs-topbar-height);
    padding: 0.7rem clamp(1rem, 3vw, 2rem);
    gap: 0.75rem;
    border-bottom: 1px solid rgba(228, 233, 240, 0.92);
    background: rgba(255, 255, 255, 0.92);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
  }

  .topbar-mobile-brand {
    display: flex;
    align-items: center;
  }

  .topbar-heading {
    min-width: 0;
  }

  .topbar-title {
    margin: 0.05rem 0 0;
    overflow: hidden;
    font-size: clamp(1.05rem, 2.2vw, 1.35rem);
    font-weight: 700;
    line-height: 1.25;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 0.65rem;
  }

  .network-status {
    align-items: center;
    gap: 0.35rem;
    color: #9a4c13;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .network-status:not([hidden]) {
    display: inline-flex;
  }

  .topbar-account {
    display: flex;
    align-items: center;
    max-width: 230px;
    padding: 0.25rem;
    gap: 0.55rem;
    border-radius: 999px;
    color: var(--crs-ink);
    text-decoration: none;
  }

  .topbar-account:hover {
    color: var(--crs-primary-dark);
    background: #f2f7f8;
  }

  .app-main {
    min-height: calc(100vh - var(--crs-topbar-height));
    min-height: calc(100dvh - var(--crs-topbar-height));
    padding: clamp(1rem, 3vw, 2rem);
  }

  .view-root {
    width: min(100%, 1480px);
    margin: 0 auto;
  }

  .mobile-bottom-nav {
    position: fixed;
    inset: auto 0 0;
    z-index: 1020;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    min-height: calc(var(--crs-mobile-nav-height) + env(safe-area-inset-bottom));
    padding: 0.45rem max(0.4rem, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(0.4rem, env(safe-area-inset-left));
    border-top: 1px solid var(--crs-border);
    background: rgba(255, 255, 255, 0.97);
    box-shadow: 0 -8px 24px rgba(16, 24, 40, 0.08);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
  }

  .mobile-bottom-nav:not(.d-lg-none) {
    display: grid;
  }

  .mobile-nav-link {
    display: flex;
    min-width: 0;
    min-height: 58px;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0.15rem;
    border-radius: 0.65rem;
    color: #667085;
    font-size: 0.64rem;
    font-weight: 600;
    text-decoration: none;
  }

  .mobile-nav-link > i {
    font-size: 1.2rem;
  }

  .mobile-nav-link:hover,
  .mobile-nav-link.is-active,
  .mobile-nav-link[aria-current="page"] {
    color: var(--crs-primary);
  }

  .mobile-scan-link {
    position: relative;
    justify-content: flex-end;
    padding-bottom: 0.25rem;
    color: var(--crs-primary-dark);
  }

  .mobile-scan-button {
    display: grid;
    width: 54px;
    height: 54px;
    margin-top: -26px;
    place-items: center;
    border: 5px solid var(--crs-canvas);
    border-radius: 50%;
    color: #fff;
    background: linear-gradient(145deg, #1b718c, var(--crs-primary-dark));
    box-shadow: 0 8px 18px rgba(15, 70, 88, 0.26);
    font-size: 1.35rem;
    transition: transform 140ms ease, box-shadow 140ms ease;
  }

  .mobile-scan-link:hover .mobile-scan-button,
  .mobile-scan-link:focus-visible .mobile-scan-button {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(15, 70, 88, 0.32);
  }

  .surface-card,
  .section-card,
  .toolbar-card {
    border: 1px solid var(--crs-border);
    border-radius: var(--crs-radius);
    background: var(--crs-surface);
    box-shadow: var(--crs-shadow-sm);
  }

  .card {
    border-color: var(--crs-border);
    border-radius: var(--crs-radius);
    box-shadow: var(--crs-shadow-sm);
  }

  .card-header {
    border-color: var(--crs-border);
  }

  .section-card {
    padding: clamp(1rem, 2.5vw, 1.5rem);
  }

  .toolbar-card {
    padding: 0.9rem;
  }

  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 1.25rem;
    gap: 1rem;
  }

  .page-header h2,
  .page-title {
    margin: 0;
    color: var(--crs-ink);
    font-size: clamp(1.35rem, 3vw, 1.8rem);
    font-weight: 700;
  }

  .page-subtitle {
    margin: 0.3rem 0 0;
    color: var(--crs-muted);
    font-size: 0.9rem;
  }

  .page-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1rem;
  }

  .metric-card {
    min-width: 0;
    padding: 1rem;
    border: 1px solid var(--crs-border);
    border-radius: var(--crs-radius);
    background: #fff;
    box-shadow: var(--crs-shadow-sm);
  }

  .metric-card-label {
    margin: 0;
    color: var(--crs-muted);
    font-size: 0.8rem;
    font-weight: 600;
  }

  .metric-card-value {
    margin: 0.35rem 0 0;
    font-size: clamp(1.45rem, 4vw, 2rem);
    font-weight: 700;
    line-height: 1.15;
  }

  .metric-icon {
    display: inline-grid;
    width: 42px;
    height: 42px;
    place-items: center;
    border-radius: 0.75rem;
    color: var(--crs-primary);
    background: var(--crs-primary-soft);
    font-size: 1.15rem;
  }

  .equipment-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1rem;
  }

  .equipment-card {
    min-width: 0;
    overflow: hidden;
    border: 1px solid var(--crs-border);
    border-radius: var(--crs-radius);
    background: #fff;
    box-shadow: var(--crs-shadow-sm);
    transition: border-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
  }

  .equipment-card:hover {
    border-color: #bfd1d8;
    box-shadow: var(--crs-shadow);
    transform: translateY(-2px);
  }

  .equipment-card-image,
  .image-frame {
    position: relative;
    display: grid;
    overflow: hidden;
    place-items: center;
    background: #eef2f6;
  }

  .equipment-card-image {
    aspect-ratio: 4 / 3;
  }

  .equipment-card-image img,
  .image-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .equipment-card-body {
    padding: 1rem;
  }

  .equipment-card-title {
    display: -webkit-box;
    margin: 0;
    overflow: hidden;
    font-size: 0.98rem;
    font-weight: 700;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  .asset-code {
    color: var(--crs-muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.76rem;
    overflow-wrap: anywhere;
  }

  .table-card {
    overflow: hidden;
    border: 1px solid var(--crs-border);
    border-radius: var(--crs-radius);
    background: #fff;
    box-shadow: var(--crs-shadow-sm);
  }

  .table {
    --bs-table-bg: transparent;
    --bs-table-border-color: #edf0f4;
    margin-bottom: 0;
    vertical-align: middle;
  }

  .table > :not(caption) > * > * {
    padding: 0.85rem 1rem;
  }

  .table thead th {
    color: #475467;
    background: #f8fafc;
    font-size: 0.76rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    white-space: nowrap;
  }

  .table tbody tr:last-child > * {
    border-bottom-width: 0;
  }

  .table-action-cell {
    width: 1%;
    white-space: nowrap;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    max-width: 100%;
    min-height: 26px;
    padding: 0.2rem 0.58rem;
    gap: 0.32rem;
    border: 1px solid transparent;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    line-height: 1.25;
    white-space: nowrap;
  }

  .status-badge::before {
    width: 0.42rem;
    height: 0.42rem;
    flex: 0 0 auto;
    border-radius: 50%;
    background: currentColor;
    content: "";
  }

  .status-badge[data-status="AVAILABLE"],
  .status-available,
  .status-active,
  .status-returned {
    color: #087a55;
    background: #e9f8f1;
