<template id="view-borrow-template">
  <section id="page-borrow" class="app-page" data-page="borrow" aria-labelledby="borrow-title">
    <header class="mb-4">
      <button type="button" class="btn btn-link px-0 text-decoration-none" data-action="back-to-equipment-detail">
        <i class="bi bi-arrow-left me-2" aria-hidden="true"></i>กลับไปดูรายละเอียดอุปกรณ์
      </button>
      <p class="text-body-secondary small mb-1">ขั้นตอนที่ 1 จาก 1</p>
      <h1 id="borrow-title" class="h3 mb-0">ส่งคำขอยืมอุปกรณ์</h1>
    </header>

    <div id="borrow-page-loading" class="d-flex align-items-center justify-content-center gap-2 py-5"
         data-state="loading" role="status" aria-live="polite">
      <span class="spinner-border spinner-border-sm text-primary" aria-hidden="true"></span>
      <span>กำลังตรวจสอบข้อมูลอุปกรณ์</span>
    </div>
    <div id="borrow-page-error" class="alert alert-danger d-none" data-state="error" role="alert">
      <span data-error-message>ไม่สามารถเตรียมแบบฟอร์มยืมได้</span>
    </div>

    <div id="borrow-page-content" class="row g-4 d-none" data-state="content">
      <div class="col-12 col-lg-5 col-xl-4 order-lg-2">
        <aside class="card position-lg-sticky" aria-labelledby="borrow-equipment-summary-title">
          <div class="ratio ratio-4x3 bg-body-tertiary">
            <img id="borrow-equipment-image" class="object-fit-contain p-3 d-none" alt="">
            <div id="borrow-equipment-image-fallback"
                 class="d-flex align-items-center justify-content-center text-body-secondary">
              <i class="bi bi-box-seam display-4" aria-hidden="true"></i>
            </div>
          </div>
          <div class="card-body">
            <p id="borrow-equipment-category" class="small text-body-secondary mb-1"></p>
            <h2 id="borrow-equipment-summary-title" class="h5 mb-2" data-field="name"></h2>
            <span id="borrow-equipment-status" class="badge rounded-pill text-bg-secondary mb-3"></span>
            <dl class="row small mb-0">
              <dt class="col-5 text-body-secondary">รหัสทรัพย์สิน</dt>
              <dd id="borrow-equipment-asset-id" class="col-7 text-break" data-field="asset_id"></dd>
              <dt class="col-5 text-body-secondary">SKU</dt>
              <dd id="borrow-equipment-sku" class="col-7 text-break" data-field="sku"></dd>
              <dt class="col-5 text-body-secondary">สถานที่</dt>
              <dd id="borrow-equipment-location" class="col-7 mb-0" data-field="location"></dd>
            </dl>
          </div>
          <div id="borrow-included-items-wrap" class="card-footer bg-body d-none">
            <h3 class="h6">อุปกรณ์ประกอบที่อยู่ในชุด</h3>
            <ul id="borrow-included-items" class="small mb-0"></ul>
          </div>
        </aside>
      </div>

      <div class="col-12 col-lg-7 col-xl-8 order-lg-1">
        <form id="form-borrow-request" class="card" novalidate>
          <input id="borrow-asset-id" name="asset_id" type="hidden">
          <input id="borrow-command-id" name="command_id" type="hidden">

          <div class="card-body p-4">
            <div id="borrow-form-error-summary" class="alert alert-danger d-none" role="alert" tabindex="-1">
              <h2 class="h6 alert-heading">กรุณาตรวจสอบข้อมูล</h2>
              <div data-error-message></div>
              <ul class="mb-0 mt-2" data-field-errors></ul>
            </div>

            <fieldset class="mb-4">
              <legend class="h5 mb-3">ข้อมูลผู้ยืม</legend>
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label for="borrow-user-name" class="form-label">ชื่อ–นามสกุล</label>
                  <input id="borrow-user-name" type="text" class="form-control" readonly
                         data-session-field="name" aria-readonly="true">
                </div>
                <div class="col-12 col-md-6">
                  <label for="borrow-user-email" class="form-label">อีเมล</label>
                  <input id="borrow-user-email" type="email" class="form-control" readonly
                         data-session-field="email" aria-readonly="true">
                </div>
                <div class="col-12">
                  <label for="borrow-user-department" class="form-label">หน่วยงาน</label>
                  <input id="borrow-user-department" type="text" class="form-control" readonly
                         data-session-field="department" aria-readonly="true">
                </div>
              </div>
              <p class="form-text mb-0 mt-2">ข้อมูลผู้ยืมอ้างอิงจากบัญชี Google Workspace ที่กำลังเข้าใช้งาน</p>
            </fieldset>

            <fieldset>
              <legend class="h5 mb-3">ช่วงเวลาที่ต้องการยืม</legend>
              <div class="row g-3 mb-4">
                <div class="col-12 col-md-6">
                  <label for="borrow-date" class="form-label">วันที่ยืม <span class="text-danger" aria-hidden="true">*</span></label>
                  <input id="borrow-date" name="borrow_date" type="date" class="form-control" required
                         aria-describedby="borrow-date-help borrow-date-error">
                  <div id="borrow-date-help" class="form-text">เลือกวันที่เริ่มใช้อุปกรณ์</div>
                  <div id="borrow-date-error" class="invalid-feedback" data-field-error="borrow_date"></div>
                </div>
                <div class="col-12 col-md-6">
                  <label for="borrow-due-date" class="form-label">กำหนดคืน <span class="text-danger" aria-hidden="true">*</span></label>
                  <input id="borrow-due-date" name="due_date" type="date" class="form-control" required
                         aria-describedby="borrow-due-date-help borrow-due-date-error">
                  <div id="borrow-due-date-help" class="form-text">กำหนดคืนต้องไม่น้อยกว่าวันที่ยืม</div>
                  <div id="borrow-due-date-error" class="invalid-feedback" data-field-error="due_date"></div>
                </div>
              </div>
            </fieldset>

            <div class="mb-4">
              <label for="borrow-purpose" class="form-label">วัตถุประสงค์การใช้งาน <span class="text-danger" aria-hidden="true">*</span></label>
              <textarea id="borrow-purpose" name="purpose" class="form-control" rows="4" maxlength="1000" required
                        aria-describedby="borrow-purpose-count borrow-purpose-error"></textarea>
              <div class="d-flex justify-content-between gap-3 form-text">
                <span>ระบุงานหรือกิจกรรมที่จะนำอุปกรณ์ไปใช้</span>
                <span id="borrow-purpose-count" data-character-count="purpose">0/1,000</span>
              </div>
              <div id="borrow-purpose-error" class="invalid-feedback" data-field-error="purpose"></div>
            </div>

            <div class="mb-4">
              <label for="borrow-note" class="form-label">หมายเหตุเพิ่มเติม <span class="text-body-secondary">(ไม่บังคับ)</span></label>
              <textarea id="borrow-note" name="note" class="form-control" rows="3" maxlength="2000"
                        aria-describedby="borrow-note-count borrow-note-error"></textarea>
              <div class="text-end form-text">
                <span id="borrow-note-count" data-character-count="note">0/2,000</span>
              </div>
              <div id="borrow-note-error" class="invalid-feedback" data-field-error="note"></div>
            </div>

            <div class="alert alert-info mb-0" role="note">
              <div class="d-flex gap-3">
                <i class="bi bi-info-circle flex-shrink-0" aria-hidden="true"></i>
                <div>
                  <h2 class="h6 alert-heading">สิ่งที่ควรทราบก่อนส่งคำขอ</h2>
                  <p class="mb-0">เมื่อส่งคำขอ ระบบจะพักอุปกรณ์รายการนี้ไว้ทันทีและส่งให้ผู้ดูแลระบบพิจารณา กรุณาติดตามสถานะในหน้า “การยืมของฉัน”</p>
                </div>
              </div>
            </div>
          </div>

          <div class="card-footer bg-body d-flex flex-column-reverse flex-sm-row justify-content-end gap-2 p-3">
            <button type="button" class="btn btn-outline-secondary" data-action="back-to-equipment-detail">ยกเลิก</button>
            <button id="borrow-submit" type="submit" class="btn btn-primary">
              <span data-submit-label><i class="bi bi-send me-2" aria-hidden="true"></i>ส่งคำขอยืม</span>
              <span class="d-none" data-submit-loading role="status">
                <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>กำลังส่งคำขอ
              </span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </section>
</template>
